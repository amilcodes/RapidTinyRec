name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q rapidtinyrec
      - run: python -m unittest discover -s tests -p test_evidence.py -v
      - run: python -m unittest discover -s tests -p test_audit_decode_pilot.py -v
      - run: python -m rapidtinyrec.audit_decode_pilot --help
  decoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m rapidtinyrec.benchmark --help
      - run: python -m rapidtinyrec.benchmark_gqa --help
      - run: python -m rapidtinyrec.pilot_decode_replay --help
